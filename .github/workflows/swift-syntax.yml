name: Swift Source Check

on:
  push:
    branches:
      - feat/ios-1.0.69-android-baseline
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        run: |
          set -euo pipefail
          curl -fsSL https://download.swift.org/swiftly/linux/swiftly-x86_64.tar.gz | tar -xz -C "$HOME"
          "$HOME/usr/bin/swiftly" init --quiet-shell-followup || true
          "$HOME/.local/share/swiftly/bin/swift" --version
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
      - name: Parse every Swift source file
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            if ! swiftc -parse "$file" >/tmp/swift-parse.log 2>&1; then
              cat /tmp/swift-parse.log
              failed=1
            fi
          done < <(find NM7IPTV Vendor/UPlayer NM7IPTVTests -type f -name '*.swift' -print0)
          test "$failed" -eq 0
