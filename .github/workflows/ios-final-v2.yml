name: NM7 IPTV iOS 1.0.71 REAL CLEARKEY

on:
  push:
    branches:
      - release/ios-1.0.69-final-drm-v2
      - fix/ios-1.0.71-drm-v3-web-ui
      - fix/ios-1.0.71-real-clearkey-navigation
  workflow_dispatch:

concurrency:
  group: nm7-ios-real-clearkey

  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version
          pod --version

      - name: Real ClearKey network/CENC smoke
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install --disable-pip-version-check -q cryptography
          .venv-smoke/bin/python - <<'PY'
          import base64
          import json
          import re
          import struct
          import urllib.request
          import xml.etree.ElementTree as ET
          from urllib.parse import urljoin

          PLAYLIST = "https://raw.githubusercontent.com/phuongnm7/nm7-tv-web/main/web-tv/playlist.json"
          UA_FALLBACK = "Dalvik/2.1.0"

          def get(url, headers=None, byte_range=None):
              req = urllib.request.Request(url, method="GET")
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              if byte_range is not None:
                  req.add_header("Range", f"bytes={byte_range[0]}-{byte_range[1]}")
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read(), r.headers, r.geturl(), getattr(r, "status", 200)

          def local(tag):
              return tag.rsplit("}", 1)[-1]

          def child(node, name):
              if node is None:
                  return None
              for x in list(node):
                  if local(x.tag) == name:
                      return x
              return None

          def children(node, name):
              return [x for x in list(node or []) if local(x.tag) == name]

          def parse_template(s, number, time_value, rep_id, bandwidth):
              if not s:
                  return ""
              repl = {
                  "Number": str(number),
                  "Time": str(time_value),
                  "RepresentationID": rep_id,
                  "Bandwidth": str(bandwidth),
              }
              def sub(m):
                  key = m.group(1)
                  width = m.group(2)
                  value = repl.get(key, m.group(0))
                  return value.zfill(int(width)) if width and value.isdigit() else value
              return re.sub(r"\$(Number|Time|RepresentationID|Bandwidth)(?:%0(\d+)d)?\$", sub, s)

          def b64url_decode(s):
              s = s.replace("-", "+").replace("_", "/")
              s += "=" * ((4 - len(s) % 4) % 4)
              return base64.b64decode(s)

          def boxes(data, start=0, end=None):
              end = len(data) if end is None else min(end, len(data))
              p = start
              while p + 8 <= end:
                  sz = struct.unpack_from(">I", data, p)[0]
                  typ = data[p+4:p+8].decode("ascii", "replace")
                  hdr = 8
                  if sz == 1:
                      if p + 16 > end:
                          return
                      sz = struct.unpack_from(">Q", data, p+8)[0]
                      hdr = 16
                  elif sz == 0:
                      sz = end - p
                  if sz < hdr or p + sz > end:
                      return
                  yield p, int(sz), typ, hdr
                  p += int(sz)

          def find_all(data, typ, start=0, end=None):
              out = []
              for p, sz, t, hdr in boxes(data, start, end):
                  if t == typ:
                      out.append((p, sz, t, hdr))
                  if sz > hdr and t in {"moov", "trak", "mdia", "minf", "stbl", "stsd", "mvex", "moof", "traf"}:
                      out.extend(find_all(data, typ, p+hdr, p+sz))
              return out

          def u32(data, off):
              return struct.unpack_from(">I", data, off)[0]

          def i32(data, off):
              return struct.unpack_from(">i", data, off)[0]

          def tenc_info(init):
              for p, sz, _, hdr in find_all(init, "tenc"):
                  if p + 32 > len(init):
                      continue
                  version = init[p+hdr]
                  pattern = init[p+hdr+1]
                  protected = init[p+hdr+2]
                  iv_size = init[p+hdr+3]
                  kid = init[p+hdr+4:p+hdr+20]
                  crypt = (pattern >> 4) & 0xF if version >= 1 else 0
                  skip = pattern & 0xF if version >= 1 else 0
                  return version, protected, iv_size, kid, crypt, skip
              raise RuntimeError("init không có tenc")

          def scheme_info(init):
              for p, sz, _, hdr in find_all(init, "schm"):
                  if p + hdr + 8 <= p + sz:
                      return init[p+hdr+4:p+hdr+8].decode("ascii", "replace")
              return "cenc"

          def parse_senc(fragment, senc):
              p, sz, _, hdr = senc
              flags = int.from_bytes(fragment[p+hdr+1:p+hdr+4], "big")
              cur = p + hdr + 4
              count = u32(fragment, cur)
              cur += 4
              entries = []
              iv_size = 16
              for _ in range(count):
                  iv = fragment[cur:cur+iv_size]
                  cur += iv_size
                  subs = None
                  if flags & 0x2:
                      n = int.from_bytes(fragment[cur:cur+2], "big")
                      cur += 2
                      subs = []
                      for _ in range(n):
                          clear = int.from_bytes(fragment[cur:cur+2], "big")
                          encrypted = u32(fragment, cur+2)
                          cur += 6
                          subs.append((clear, encrypted))
                  entries.append((iv, subs))
              return entries

          def inspect_and_decrypt(init, media, key_bytes, scheme):
              moofs = list(boxes(media))
              moof = next((x for x in moofs if x[2] == "moof"), None)
              if not moof:
                  raise RuntimeError("media không có moof")
              mp, ms, _, mh = moof
              traf = next((x for x in boxes(media, mp+mh, mp+ms) if x[2] == "traf"), None)
              if not traf:
                  raise RuntimeError("moof không có traf")
              tp, ts, _, th = traf
              tfhd = next((x for x in boxes(media, tp+th, tp+ts) if x[2] == "tfhd"), None)
              trun = next((x for x in boxes(media, tp+th, tp+ts) if x[2] == "trun"), None)
              senc = next((x for x in boxes(media, tp+th, tp+ts) if x[2] == "senc"), None)
              if not tfhd or not trun or not senc:
                  raise RuntimeError("fragment thiếu tfhd/trun/senc; chưa hỗ trợ saiz/saio smoke path")
              fp, fs, _, fh = tfhd
              flags = int.from_bytes(media[fp+fh+1:fp+fh+4], "big")
              cur = fp + fh + 4
              track_id = u32(media, cur)
              cur += 4
              base = mp
              if flags & 0x000001:
                  base = int.from_bytes(media[cur:cur+8], "big")
                  cur += 8
              if flags & 0x000002:
                  cur += 4
              default_size = None
              if flags & 0x000008:
                  cur += 4
              if flags & 0x000010:
                  default_size = u32(media, cur)
                  cur += 4
              if flags & 0x000020:
                  cur += 4

              rp, rs, _, rh = trun
              rflags = int.from_bytes(media[rp+rh+1:rp+rh+4], "big")
              rcur = rp + rh + 4
              sample_count = u32(media, rcur)
              rcur += 4
              data_offset = mp + ms
              if rflags & 0x000001:
                  data_offset = base + i32(media, rcur)
                  rcur += 4
              if rflags & 0x000004:
                  rcur += 4
              if sample_count < 1:
                  raise RuntimeError("trun sample_count=0")
              sample_size = default_size
              if rflags & 0x000100:
                  rcur += 4
              if rflags & 0x000200:
                  sample_size = u32(media, rcur)
                  rcur += 4
              if rflags & 0x000400:
                  rcur += 4
              if rflags & 0x000800:
                  rcur += 4
              if sample_size is None:
                  raise RuntimeError("không có sample size (trun/tfhd/trex)")

              # Standalone media segments normally have moof/data offsets local to
              # this response; normalize a file-relative offset if needed.
              local_sample = data_offset
              if local_sample < 0 or local_sample + sample_size > len(media):
                  local_sample = data_offset
              if local_sample < 0 or local_sample + sample_size > len(media):
                  raise RuntimeError(
                      f"sample range invalid: dataOffset={data_offset} size={sample_size} mediaBytes={len(media)}"
                  )

              entries = parse_senc(media, senc)
              if not entries:
                  raise RuntimeError("senc không có entry")
              iv, subs = entries[0]

              from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes

              sample = bytearray(media[local_sample:local_sample+sample_size])
              if scheme.lower() in ("cenc", "cbc1"):
                  counter = iv + (b"\0" * 8) if len(iv) == 8 else iv
                  cryptor = Cipher(
                      algorithms.AES(key_bytes),
                      modes.CTR(counter)
                  ).encryptor()

                  if subs:
                      pos = 0
                      for clear, encrypted in subs:
                          pos += clear
                          if encrypted:
                              sample[pos:pos+encrypted] = cryptor.update(bytes(sample[pos:pos+encrypted]))
                              pos += encrypted
                  else:
                      sample[:] = cryptor.update(bytes(sample))
                  cryptor.finalize()
              elif scheme.lower() == "cbcs":
                  # Basic CBCS smoke: decrypt complete encrypted 16-byte blocks.
                  decryptor = Cipher(
                      algorithms.AES(key_bytes),
                      modes.CBC(iv)
                  ).decryptor()
                  clear = bytes(sample[:len(sample)//16*16])
                  sample[:len(clear)] = decryptor.update(clear)
                  decryptor.finalize()
              else:
                  raise RuntimeError(f"scheme chưa hỗ trợ: {scheme}")

              # Validate a plausible ISO BMFF AVC/HEVC length-prefixed NAL start.
              nal_len = int.from_bytes(sample[:4], "big") if len(sample) >= 4 else 0
              plausible = 0 < nal_len <= len(sample) - 4
              first_type = sample[4] & 0x1F if len(sample) >= 5 else 0
              plausible = plausible and 1 <= first_type <= 31
              if not plausible:
                  raise RuntimeError(
                      f"decrypted sample không có NAL structure hợp lệ: "
                      f"first4={sample[:4].hex()} first5={sample[:5].hex()}"
                  )

              print(
                  f"REAL-CLEARKEY-SMOKE PASS: track={track_id} scheme={scheme} "
                  f"sampleSize={sample_size} sampleOffset={local_sample} "
                  f"IV={iv.hex()} decryptedHead={bytes(sample[:16]).hex()}"
              )

          # Current known-good ClearKey candidate from phuongnm7/Iptv-phuongnm7:
          # On Sports 50fps. Keep the smoke test tied to the same real source
          # that the web application uses.
          mpd_url = "https://livevlisctcdnw.seenow.vn/Live_DASHDRM2/THETHAO_HD/manifest.mpd"
          kid = bytes.fromhex("f3d73b3a9b89462ebf7911004ea3b3b9")
          key = bytes.fromhex("2e547a81ff90aa02648cb9e3f79e7339")
          headers = {"User-Agent": UA_FALLBACK}
          proxy_base = "https://nm7-tv-web.phuongnm7-iptv.workers.dev/api/stream"

          def proxy_url(target):
              from urllib.parse import quote
              return proxy_base + "?u=" + quote(target, safe="") + "&ua=" + quote(headers["User-Agent"], safe="")

          # The web application reaches this CDN through the same-origin stream
          # proxy. Reproduce that transport path in CI before blaming CENC.
          mpd_proxy = proxy_url(mpd_url)
          mpd_bytes, _, mpd_final, _ = get(mpd_proxy, {})
          print(f"Real MPD fetched through NM7 proxy: {mpd_final} bytes={len(mpd_bytes)}")
          mpd_url = mpd_proxy
          root = ET.fromstring(mpd_bytes)

          periods = children(root, "Period")
          if not periods:
              raise RuntimeError("MPD không có Period")
          period = periods[0]

          def find_video_adaptation(period_node):
              for adaptation_node in children(period_node, "AdaptationSet"):
                  mime = (adaptation_node.attrib.get("mimeType") or "").lower()
                  content_type = (adaptation_node.attrib.get("contentType") or "").lower()
                  if content_type == "video" or mime.startswith("video/"):
                      return adaptation_node
                  for rep in children(adaptation_node, "Representation"):
                      if (rep.attrib.get("mimeType") or "").lower().startswith("video/"):
                          return adaptation_node
              return None

          adaptation = find_video_adaptation(period)
          if adaptation is None:
              raise RuntimeError("MPD không có video AdaptationSet")

          reps = children(adaptation, "Representation")
          if not reps:
              raise RuntimeError("video AdaptationSet không có Representation")

          rep = reps[0]
          rep_id = rep.attrib.get("id", "")
          bandwidth = int(rep.attrib.get("bandwidth", "0"))

          base_url = mpd_url
          for node in (root, period, adaptation, rep):
              b = child(node, "BaseURL")
              if b is not None and b.text:
                  base_url = urljoin(base_url, b.text.strip())

          template = child(rep, "SegmentTemplate") or child(adaptation, "SegmentTemplate")
          if template is None:
              raise RuntimeError(
                  "MPD thực tế không dùng SegmentTemplate; cần SegmentBase/CENC path kiểm thử riêng"
              )

          start_number = int(template.attrib.get("startNumber", "1"))
          timeline = child(template, "SegmentTimeline")
          first_s = child(timeline, "S")
          time_value = (
              int(first_s.attrib.get("t", "0"))
              if first_s is not None else 0
          )

          init_ref = parse_template(
              template.attrib.get("initialization", ""),
              start_number, time_value, rep_id, bandwidth
          )
          media_ref = parse_template(
              template.attrib.get("media", ""),
              start_number, time_value, rep_id, bandwidth
          )
          if not init_ref or not media_ref:
              raise RuntimeError(
                  "MPD thiếu initialization/media template"
              )

          init_url = urljoin(base_url, init_ref)
          media_url = urljoin(base_url, media_ref)

          init_proxy = proxy_url(init_url)
          media_proxy = proxy_url(media_url)
          init, _, init_final, _ = get(init_proxy, {})
          media, _, media_final, _ = get(media_proxy, {})

          print(
              f"Observed real stream: init={init_final} bytes={len(init)} "
              f"media={media_final} bytes={len(media)}"
          )

          version, protected, iv_size, tenc_kid, crypt, skip = tenc_info(init)
          scheme = scheme_info(init)
          if protected != 1:
              raise RuntimeError("tenc isProtected != 1")
          if tenc_kid != kid:
              raise RuntimeError(
                  f"KID mismatch: playlist={kid.hex()} tenc={tenc_kid.hex()}"
              )

          print(
              f"DRM structure: scheme={scheme} tencVersion={version} "
              f"ivSize={iv_size} crypt={crypt} skip={skip} "
              f"KID={tenc_kid.hex()}"
          )
          inspect_and_decrypt(init, media, key, scheme)

          PY

      - name: Prepare bundled visual assets
        run: |
          set -euo pipefail
          test -s NM7IPTV/Resources/nm7_default_background_new.webp
          test -s NM7IPTV/Resources/nm7_default_background.jpg
          test -s NM7IPTV/Resources/nm7_tv_launcher_android.png
          mkdir -p NM7IPTV/Assets.xcassets/AppIcon.appiconset
          sips -z 1024 1024 NM7IPTV/Resources/nm7_tv_launcher_android.png --out NM7IPTV/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          cat > NM7IPTV/Assets.xcassets/Contents.json <<'EOF'
          {"info":{"author":"xcode","version":1}}
          EOF
          cat > NM7IPTV/Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF'
          {
            "images":[
              {"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024","scale":"1x"}
            ],
            "info":{"author":"xcode","version":1}
          }
          EOF

      - name: Generate workspace
        run: |
          set -euo pipefail
          xcodegen generate
          pod install --repo-update

      - name: Simulator build
        run: |
          xcodebuild -workspace NM7IPTV.xcworkspace -scheme NM7IPTV -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Unit tests
        run: |
          set -euo pipefail
          DESTINATION_ID="$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone ' | grep -oE '[0-9A-F-]{36}' | head -n 1)"
          test -n "$DESTINATION_ID"
          xcodebuild -workspace NM7IPTV.xcworkspace -scheme NM7IPTV -destination "id=$DESTINATION_ID" -configuration Debug CODE_SIGNING_ALLOWED=NO test

      - name: Device build
        run: |
          xcodebuild -workspace NM7IPTV.xcworkspace -scheme NM7IPTV -sdk iphoneos -configuration Release -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Verify final app assets
        run: |
          set -euo pipefail
          APP="build/device/Build/Products/Release-iphoneos/NM7IPTV.app"
          test -d "$APP"
          test -f "$APP/nm7_default_background_new.webp"
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "1.0.71"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx "71"

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf Payload NM7-IPTV-iOS-1.0.71-real-clearkey-unsigned.ipa
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/NM7IPTV.app Payload/
          xattr -cr Payload
          /usr/bin/zip -qry -X NM7-IPTV-iOS-1.0.71-real-clearkey-unsigned.ipa Payload
          unzip -t NM7-IPTV-iOS-1.0.71-real-clearkey-unsigned.ipa
          shasum -a 256 NM7-IPTV-iOS-1.0.71-real-clearkey-unsigned.ipa > NM7-IPTV-iOS-1.0.71-real-clearkey-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NM7-IPTV-iOS-1.0.71-REAL-CLEARKEY
          path: |
            NM7-IPTV-iOS-1.0.71-real-clearkey-unsigned.ipa
            NM7-IPTV-iOS-1.0.71-real-clearkey-unsigned.ipa.sha256
          retention-days: 30
