name: Build NM7 IPTV iOS

on:
  push:
    branches:
      - main
      - feat/ios-1.0.69-android-baseline
  pull_request:
    branches:
      - main
      - feat/ios-1.0.69-android-baseline
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install xcodegen
          xcodegen --version
          pod --version

      - name: Prepare Android 1.0.69 visual assets
        run: |
          set -euo pipefail
          mkdir -p NM7IPTV/Resources NM7IPTV/Assets.xcassets/AppIcon.appiconset
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 60 \
            "https://raw.githubusercontent.com/phuongnm7/nm7-tv-android/f79fc06009f20e0ac3a5859c0abcfd6ce70a6763/app/src/main/res/drawable/nm7_default_background.jpg" \
            -o NM7IPTV/Resources/nm7_default_background.jpg
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 60 \
            "https://raw.githubusercontent.com/phuongnm7/nm7-tv-android/f79fc06009f20e0ac3a5859c0abcfd6ce70a6763/app/src/main/res/mipmap-xxxhdpi/nm7_tv_launcher.png" \
            -o NM7IPTV/Resources/nm7_tv_launcher_android.png
          sips -z 1024 1024 NM7IPTV/Resources/nm7_tv_launcher_android.png --out NM7IPTV/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          cat > NM7IPTV/Assets.xcassets/Contents.json <<'EOF'
          {
            "info": { "author": "xcode", "version": 1 }
          }
          EOF
          cat > NM7IPTV/Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF'
          {
            "images": [
              {
                "filename": "AppIcon.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024",
                "scale": "1x"
              }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          EOF

      - name: Generate workspace
        run: |
          xcodegen generate
          pod install --repo-update

      - name: Simulator build
        run: |
          xcodebuild -workspace NM7IPTV.xcworkspace -scheme NM7IPTV -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Unit tests
        run: |
          DESTINATION_ID="$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone ' | grep -oE '[0-9A-F-]{36}' | head -n 1)"
          test -n "$DESTINATION_ID"
          xcodebuild -workspace NM7IPTV.xcworkspace -scheme NM7IPTV -destination "id=$DESTINATION_ID" -configuration Debug CODE_SIGNING_ALLOWED=NO test

      - name: Device build
        run: |
          xcodebuild -workspace NM7IPTV.xcworkspace -scheme NM7IPTV -sdk iphoneos -configuration Release -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package IPA
        run: |
          rm -rf Payload NM7-IPTV-iOS-1.0.69-unsigned.ipa
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/NM7IPTV.app Payload/
          xattr -cr Payload
          /usr/bin/zip -qry -X NM7-IPTV-iOS-1.0.69-unsigned.ipa Payload
          unzip -t NM7-IPTV-iOS-1.0.69-unsigned.ipa
          test -f Payload/NM7IPTV.app/Info.plist
          test -f Payload/NM7IPTV.app/NM7IPTV
          test -d Payload/NM7IPTV.app/Frameworks
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/NM7IPTV.app/Info.plist)"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/NM7IPTV.app/Info.plist)"
          echo "IPA_VERSION=$VERSION IPA_BUILD=$BUILD"
          test "$VERSION" = "1.0.69"
          test "$BUILD" = "69"
          shasum -a 256 NM7-IPTV-iOS-1.0.69-unsigned.ipa > NM7-IPTV-iOS-1.0.69-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NM7-IPTV-iOS-1.0.69-final-unsigned-IPA
          path: |
            NM7-IPTV-iOS-1.0.69-unsigned.ipa
            NM7-IPTV-iOS-1.0.69-unsigned.ipa.sha256
          retention-days: 30
