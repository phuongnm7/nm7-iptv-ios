name: Build NM7 IPTV iOS

on:
  push:
    branches:
      - main
      - feat/ios-1.0.69-android-baseline
  pull_request:
    branches:
      - main
      - feat/ios-1.0.69-android-baseline
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install xcodegen
          pod --version

      - name: Generate Xcode workspace
        run: |
          xcodegen generate
          pod install --repo-update

      - name: Build iPhone and iPad Simulator app
        run: >
          xcodebuild
          -workspace NM7IPTV.xcworkspace
          -scheme NM7IPTV
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          DESTINATION_ID="$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone ' | sed -E -n 's/.*\\(([0-9A-F-]{36})\\).*/\\1/p' | head -n 1)"
          if [ -z "$DESTINATION_ID" ]; then
            echo "No available iPhone Simulator found."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using Simulator: $DESTINATION_ID"
          xcodebuild             -workspace NM7IPTV.xcworkspace             -scheme NM7IPTV             -destination "id=$DESTINATION_ID"             -configuration Debug             CODE_SIGNING_ALLOWED=NO             test

      - name: Build unsigned iPhone and iPad device app
        run: >
          xcodebuild
          -workspace NM7IPTV.xcworkspace
          -scheme NM7IPTV
          -sdk iphoneos
          -configuration Release
          -derivedDataPath build/device
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Package and validate unsigned IPA
        run: |
          rm -rf Payload NM7-IPTV-iOS-1.0.69-unsigned.ipa
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/NM7IPTV.app Payload/
          xattr -cr Payload
          /usr/bin/zip -qry -X NM7-IPTV-iOS-1.0.69-unsigned.ipa Payload
          unzip -t NM7-IPTV-iOS-1.0.69-unsigned.ipa
          unzip -Z1 NM7-IPTV-iOS-1.0.69-unsigned.ipa > ipa-contents.txt
          grep -Fxq "Payload/NM7IPTV.app/Info.plist" ipa-contents.txt
          grep -Fxq "Payload/NM7IPTV.app/NM7IPTV" ipa-contents.txt
          find Payload/NM7IPTV.app/Frameworks -maxdepth 2 -name "*VLCKit*" -print -quit | grep -q .
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/NM7IPTV.app/Info.plist | grep -Fxq "1.0.69"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/NM7IPTV.app/Info.plist | grep -Fxq "69"
          shasum -a 256 NM7-IPTV-iOS-1.0.69-unsigned.ipa > NM7-IPTV-iOS-1.0.69-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NM7-IPTV-iOS-1.0.69-unsigned-IPA
          path: |
            NM7-IPTV-iOS-1.0.69-unsigned.ipa
            NM7-IPTV-iOS-1.0.69-unsigned.ipa.sha256
          retention-days: 30
